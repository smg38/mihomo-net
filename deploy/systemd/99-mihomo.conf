# Настройки сети для ядра для Mihomo.
# Важно: эти настройки не сохраняются после перезагрузки, поэтому их нужно закрепить в /etc/sysctl.d/99-mihomo.conf
# Версия: 3.3.0 2026-11-07
sysctl -w net.ipv4.ip_local_port_range="10240 65535"
sysctl -w net.ipv4.tcp_tw_reuse=1
sysctl -w net.ipv4.tcp_fin_timeout=15